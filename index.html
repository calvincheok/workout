<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101418">
<title>Taper</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ink:#101418;
  --ink-2:#3b444e;
  --ink-3:#7c8792;
  --paper:#f2f3f0;
  --card:#ffffff;
  --line:#dfe2dd;
  --cobalt:#1f37d8;
  --pine:#0d6f5c;
  --amber:#b5761a;
  --rose:#b3243c;
  --r:14px;
  --pad:16px;
  --f-disp:"Helvetica Neue",Helvetica,Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-num:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--f-body);
  font-size:16px;line-height:1.45;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

/* ---------- signature: the taper chevron ---------- */
.taper{display:block;width:100%;height:8px}
.taper i{display:block;height:100%;background:
  repeating-linear-gradient(115deg,var(--ink) 0 2px,transparent 2px 9px);opacity:.22}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;
  padding:calc(12px + env(safe-area-inset-top)) var(--pad) 12px;
}
.eyebrow{
  font-family:var(--f-num);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:#98a3ad;display:flex;justify-content:space-between;gap:8px
}
h1{
  font-family:var(--f-disp);font-weight:800;letter-spacing:-.03em;
  font-size:27px;line-height:1.05;margin:6px 0 0;text-transform:uppercase
}
h1 small{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;
  text-transform:none;color:#98a3ad;margin-top:5px}

/* ---------- layout ---------- */
main{padding:var(--pad) var(--pad) 8px;max-width:560px;margin:0 auto}
.sec{margin:0 0 22px}
.sec-h{
  font-family:var(--f-num);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-3);display:flex;align-items:center;gap:10px;margin:0 0 10px
}
.sec-h:after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad)}
.card + .card{margin-top:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.muted{color:var(--ink-3)}
.small{font-size:13.5px}
.tiny{font-size:12px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.big{font-family:var(--f-disp);font-weight:800;letter-spacing:-.02em;font-size:30px;line-height:1}
.mid{font-family:var(--f-disp);font-weight:700;letter-spacing:-.01em;font-size:18px}
.label{font-family:var(--f-num);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- today hero ---------- */
.hero{background:var(--ink);color:#fff;border:0;border-radius:var(--r);padding:0;overflow:hidden}
.hero .body{padding:18px var(--pad)}
.hero .kind{font-family:var(--f-disp);font-weight:800;font-size:34px;letter-spacing:-.03em;
  text-transform:uppercase;line-height:.98}
.hero .meta{color:#98a3ad;font-size:13px;margin-top:6px}
.hero ol{margin:14px 0 0;padding:0;list-style:none;counter-reset:x}
.hero ol li{counter-increment:x;display:flex;gap:10px;padding:7px 0;border-top:1px solid #23292f;
  font-size:14.5px;color:#e7eaed}
.hero ol li:before{content:counter(x);font-family:var(--f-num);font-size:11px;color:#6d7883;width:14px;
  padding-top:3px}
.rest-hero{background:linear-gradient(180deg,#0d6f5c,#0b5b4c);color:#fff}
.rest-hero .meta{color:#b7ded4}

/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:52px;border-radius:12px;background:var(--cobalt);color:#fff;
  font-family:var(--f-disp);font-weight:800;letter-spacing:.03em;text-transform:uppercase;font-size:14.5px
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.dark{background:var(--ink)}
.btn.pine{background:var(--pine)}
.btn.sm{min-height:40px;font-size:12.5px;border-radius:10px;padding:0 14px;width:auto}
.btn[disabled]{opacity:.4}
.link{color:var(--cobalt);font-weight:600;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}

/* ---------- bars ---------- */
.bar{height:9px;border-radius:99px;background:#e6e8e3;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cobalt);border-radius:99px;transition:width .3s}
.bar.pine i{background:var(--pine)}
.bar.amber i{background:var(--amber)}

/* ---------- chips / pills ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;
  padding:5px 11px;font-size:12.5px;background:#fff}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill{font-family:var(--f-num);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  padding:3px 8px;border-radius:99px;border:1px solid currentColor}
.c-a{color:var(--cobalt)}.c-b{color:var(--rose)}.c-core{color:var(--amber)}.c-rest{color:var(--pine)}

/* ---------- inputs ---------- */
.field{display:flex;flex-direction:column;gap:6px}
input[type=number],input[type=text],select,textarea{
  width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;background:#fff;
  font-family:var(--f-num);font-size:17px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cobalt)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:52px;height:52px;border:1.5px solid var(--line);border-radius:11px;background:#fff;
  font-size:24px;font-weight:600;display:grid;place-items:center}
.stepper input{text-align:center;font-size:24px;font-weight:700}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:46px;border:1.5px solid var(--line);border-radius:11px;background:#fff;
  font-size:13.5px;font-weight:600}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- exercise runner ---------- */
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.setdots{display:flex;gap:6px;margin-top:12px}
.setdots span{flex:1;height:6px;border-radius:99px;background:#e6e8e3}
.setdots span.done{background:var(--pine)}
.setdots span.now{background:var(--cobalt)}
.timer{font-family:var(--f-num);font-size:56px;font-weight:600;letter-spacing:-.03em;text-align:center;
  font-variant-numeric:tabular-nums}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(16,20,24,.55);display:flex;align-items:flex-end}
.sheet .inner{background:var(--paper);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:20px var(--pad) calc(24px + env(safe-area-inset-bottom))}
.sheet h3{font-family:var(--f-disp);font-size:21px;letter-spacing:-.02em;margin:0 0 4px}
.sheet h4{font-family:var(--f-num);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);margin:18px 0 6px}
.sheet ul{margin:0;padding-left:18px}
.sheet li{margin:4px 0;font-size:14.5px}
.note{border-left:3px solid var(--amber);background:#fdf7ec;padding:10px 12px;border-radius:0 10px 10px 0;
  font-size:13.5px}
.note.blue{border-color:var(--cobalt);background:#eef1fe}
.note.pine{border-color:var(--pine);background:#eaf5f2}

/* ---------- nav ---------- */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)
}
nav button{padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3)}
nav button span.i{font-size:19px;line-height:1}
nav button span.t{font-family:var(--f-num);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
nav button.on{color:var(--ink)}
nav button.on span.t{color:var(--ink)}

/* ---------- calendar ---------- */
.wk{display:grid;grid-template-columns:34px repeat(7,1fr);gap:5px;align-items:center}
.wk .d{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-family:var(--f-num);
  font-size:11px;font-weight:600;border:1px solid var(--line);background:#fff}
.wk .wn{font-family:var(--f-num);font-size:10px;color:var(--ink-3)}
.d.A{background:#e7eafd;border-color:#c7cffa;color:#1f37d8}
.d.B{background:#fbe9ec;border-color:#f3ccd4;color:#b3243c}
.d.C{background:#fdf3e3;border-color:#f0dcb8;color:#8f5d13}
.d.R{background:#eaf5f2;border-color:#cbe6de;color:#0d6f5c}
.d.X{background:#f5f6f4;color:#b3bcc4}
.d.today{outline:2.5px solid var(--ink);outline-offset:1px}
.d.done:after{content:"";position:absolute}
.dwrap{position:relative}
.dwrap .tick{position:absolute;right:2px;top:1px;font-size:9px;color:var(--pine)}

/* ---------- chart ---------- */
svg.chart{width:100%;height:120px;display:block;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}

/* ---------- onboarding ---------- */
.ob{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px var(--pad);
  max-width:520px;margin:0 auto}
.ob .step{font-family:var(--f-num);font-size:10.5px;letter-spacing:.18em;color:var(--ink-3);text-transform:uppercase}
.ob h2{font-family:var(--f-disp);font-weight:800;font-size:40px;letter-spacing:-.035em;line-height:1;
  margin:10px 0 14px;text-transform:uppercase}
.ob .checklist{list-style:none;padding:0;margin:0}
.ob .checklist li{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.ob .checklist li b{color:var(--pine)}
.wordmark{font-family:var(--f-disp);font-weight:800;font-size:13px;letter-spacing:.4em;text-transform:uppercase;
  color:var(--ink-3)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:f .22s ease-out}
@keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================= TAPER — personal home coach ================= */

/* ---------------- storage (works inside a preview AND as a local file) ---------------- */
const KEY = 'taper_v1';
async function saveState(){
  const s = JSON.stringify(S);
  try{ if(window.storage && window.storage.set) await window.storage.set(KEY, s, false); }catch(e){}
  try{ localStorage.setItem(KEY, s); }catch(e){}
}
async function loadState(){
  let raw = null;
  try{ if(window.storage && window.storage.get){ const r = await window.storage.get(KEY, false); if(r && r.value) raw = r.value; } }catch(e){}
  if(!raw){ try{ raw = localStorage.getItem(KEY); }catch(e){} }
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}

/* ---------------- exercise library ---------------- */
const EX = {

  pushup:{ name:'Push-up', sets:3, lo:6, hi:15, rest:90, side:false, kit:'Floor',

    how:['Hands slightly wider than shoulders, under the chest line.','Body in one straight line from head to heels.','Lower until your chest is a fist from the floor.','Press back up without letting the hips sag.'],
    tips:['Elbows go back at roughly 45°, not straight out.','Squeeze glutes and brace the stomach the whole set.','Knee version keeps the same straight line from head to knees.'],

    prio:1,
    prog:'At the top of the range, add a 1 second squeeze at the top before adding reps.',
    how:['Put one hand on a chair or bed edge, feet staggered, back flat.','Let the dumbbell hang, arm straight, shoulder relaxed.','Pull the elbow backward toward your hip.','Lower under control until the arm is fully straight.'],
    tips:['Pull with the elbow, not the hand.','Keep the shoulder pulled down and back at the top.','Do not rotate your torso to help the weight up.'],
    miss:['Yanking with the lower back.','Elbow flaring out sideways.','Cutting the bottom of the rep short.'],
    mus:['Latissimus dorsi','Upper back','Rear shoulder','Biceps'] },

  press:{ name:'One-arm Dumbbell Shoulder Press', sets:3, lo:8, hi:15, rest:90, side:true, kit:'7.5 kg dumbbell',
    prog:'Add a 1 second pause at the bottom, or press slower, before chasing more reps.',
    how:['Stand tall, dumbbell at shoulder height, palm facing forward.','Brace your stomach and squeeze your glutes.','Press straight up until the arm is locked overhead.','Lower slowly back to shoulder height.'],
    tips:['Ribs down, do not lean back to press.','Wrist stacked over the elbow.','Free hand on your hip or a wall for balance.'],
    miss:['Bouncing with the knees.','Arching the lower back.','Stopping halfway down.'],
    mus:['Front and side shoulder','Triceps','Upper back','Core'] },

  lateral:{ name:'One-arm Dumbbell Lateral Raise', sets:3, lo:12, hi:20, rest:50, side:true, kit:'7.5 kg dumbbell',
    prio:1,
    heavy:true,
    prog:'7.5 kg is heavy for this one. Cut reps or range before you swing. Slow lowering beats extra reps.',
    how:['Stand tall, dumbbell by your side, slight bend in the elbow.','Raise the arm out to the side, leading with the elbow.','Stop at about shoulder height.','Lower slowly, 3 seconds, all the way down.'],
    tips:['Zero swing, if the body moves the weight is too heavy for that rep.','Keep the shoulder pulled away from the ear.','Half range with control is a valid rep, log it honestly.'],
    miss:['Using the hips as a slingshot.','Shrugging the weight up.','Going above shoulder height.'],
    mus:['Side shoulder (lateral deltoid)','Upper back','Core'] },

  glute:{ name:'Dumbbell Glute Bridge', sets:3, lo:15, hi:20, rest:60, side:false, kit:'7.5 kg dumbbell + floor',
    prog:'Add a 2 second squeeze at the top, then try single-leg with no weight.',
    how:['Lie on your back, knees bent, heels close to your glutes.','Rest the dumbbell carefully across your hips and hold it.','Drive your heels down and lift the hips until the body is a straight line.','Lower until the glutes lightly touch the floor.'],
    tips:['Squeeze the glutes hard at the top for a full second.','Ribs down, do not arch the lower back to get higher.','Place and remove the dumbbell gently, both hands.'],
    miss:['Pushing through the toes.','Hyperextending the lower back at the top.','Rushing the reps.'],
    mus:['Glutes','Hamstrings','Core'] },

  bss:{ name:'Bulgarian Split Squat', sets:3, lo:8, hi:12, rest:90, side:true, kit:'Bodyweight + chair/bed',
    prog:'Once 3 × 12 per leg is steady, hold the 7.5 kg dumbbell in the opposite hand.',
    how:['Stand about one long stride in front of a chair or bed.','Rest the top of your back foot on it.','Lower straight down until the front thigh is near parallel.','Drive through the front foot to stand.'],
    tips:['Most of your weight stays on the front leg.','Small lean forward is fine, keep the back flat.','Balance shaky? Fingertips on a wall.'],
    miss:['Stepping too short so the knee jams forward.','Pushing off the back foot.','Front heel lifting.'],
    mus:['Quadriceps','Glutes','Adductors','Core'],
    alt:'If balance is a problem, do reverse lunges instead, same reps.' },

  floorpress:{ name:'One-arm Dumbbell Floor Press', sets:3, lo:10, hi:15, rest:90, side:true, kit:'7.5 kg dumbbell + floor',
    prog:'Add a 1 second pause with the elbow resting on the floor.',
    how:['Lie on your back, knees bent, dumbbell in one hand over the chest.','Elbow at roughly 45° from your body.','Lower until the upper arm touches the floor.','Press back up over the chest line.'],
    tips:['Keep the wrist stacked over the elbow.','Light touch of the floor, do not bounce.','Free hand out to the side for stability.'],

  rdl:{ name:'Dumbbell Romanian Deadlift', sets:3, lo:10, hi:15, rest:90, side:false, kit:'7.5 kg dumbbell',

  triceps:{ name:'Dumbbell Overhead Triceps Extension', sets:3, lo:10, hi:15, rest:60, side:false, kit:'7.5 kg dumbbell',
    prog:'Pause 1 second at the bottom stretch, then slow the lowering to 3 seconds.',

  plank:{ name:'Plank', sets:3, lo:30, hi:60, rest:45, side:false, kit:'Floor', time:true,

  revcrunch:{ name:'Reverse Crunch', sets:3, lo:10, hi:15, rest:45, side:false, kit:'Floor',

  deadbug:{ name:'Dead Bug', sets:3, lo:8, hi:12, rest:45, side:true, kit:'Floor',

};

const WARMUP = [
  'March in place — 60 sec','Arm circles — 30 sec','Bodyweight squats — 10 reps',
  'Glute bridges — 10 reps','Shoulder mobility — 30 sec','Easy push-ups — 5 reps'
];

const WORKOUTS = {
  A:{ code:'A', title:'Workout A', dur:'40–50 min', cls:'c-a', exs:['squat','pushup','row','press','lateral','glute'] },
  B:{ code:'B', title:'Workout B', dur:'40–50 min', cls:'c-b', exs:['bss','floorpress','row','rdl','curl','triceps'] },
  C:{ code:'C', title:'Core + Cardio', dur:'40–55 min', cls:'c-core', exs:['plank','revcrunch','deadbug'] }
};
/* Workout B gives the row an extra set. Back is the priority. */
const SET_OVERRIDE = { 'B:row':4 };

const PHASES = [
  {w:[1,2], name:'Phase 1 — Learn the movements', goal:'Easy to moderate. Never to failure. Form is the only score this fortnight.'},
  {w:[3,4], name:'Phase 2 — Build consistency', goal:'Use the prescribed sets and reps, and record every set honestly.'},
  {w:[5,8], name:'Phase 3 — Progressive overload', goal:'Beat last week using reps, tempo, pauses or harder variations.'},
  {w:[9,12],name:'Phase 4 — Compare and push', goal:'Measure against your own week 1 numbers. Harder variations over endless reps.'}
];

/* Monday/Friday carry the primary lift, Wednesday the other. Odd weeks start with A. */
function dayPlan(week, dow){ // dow: 0=Sun..6=Sat
  const primary = (week % 2 === 1) ? 'A' : 'B';
  const secondary = primary === 'A' ? 'B' : 'A';
  switch(dow){
    case 1: return {type:primary};

function sessionOn(dstr){ return S.sessions.find(s=>s.date===dstr); }

function streak(){
  let n=0; const d=new Date(); d.setHours(0,0,0,0);
  for(let i=0;i<400;i++){
    const key=ymd(d), w=weekNumber(d), p=dayPlan(w,d.getDay());
    const done = !!sessionOn(key);
    const isRest = p.type==='REST';
    const log = S.daily[key];
    const movedOnRecovery = p.type==='RECOVERY' && log && (log.steps>=S.targets.stepsLo);
    if(i===0){ // today does not break a streak yet
      if(done||isRest||movedOnRecovery) n++;
    } else {
      if(done||isRest||movedOnRecovery) n++; else break;
    }
    d.setDate(d.getDate()-1);
  }
  return n;
}
function weekStats(week){
  const start=mondayOf(parseYmd(S.profile.startDate)); start.setDate(start.getDate()+(week-1)*7);
  let planned=0, done=0;
  for(let i=0;i<7;i++){
    const d=new Date(start); d.setDate(d.getDate()+i);
    const t=dayPlan(week,d.getDay()).type;
    if(t==='A'||t==='B'||t==='C'){ planned++; if(sessionOn(ymd(d))) done++; }
  }
  return {planned,done};
}

/* progressive-overload check: has this exercise topped out recently? */
function shouldProgress(exId){
  const hist = [];
  for(let i=S.sessions.length-1;i>=0 && hist.length<1;i--){
    const s=S.sessions[i]; const sets=s.sets.filter(x=>x.ex===exId);
    if(sets.length) hist.push(sets);
  }
  if(!hist.length) return false;
  const sets=hist[0], e=EX[exId];
  const allTop = sets.every(x=>x.reps>=e.hi);
  const easy = sets.filter(x=>x.diff==='Hard').length===0;
  return allTop && easy;
}

   The app renders in English, then a single pass rewrites text nodes.
   Only text nodes are touched, so tags, classes and data attributes stay intact. */
function isZH(){ return S && S.lang==='zh'; }
function setLang(l){
  S.lang=l; saveState();
  document.documentElement.lang = l==='zh'?'zh-CN':'en';
  document.body.style.fontFamily = l==='zh'
    ? '-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif'
    : '';
  render();
}
function applyLang(root){
  if(!isZH() || !root) return;
  const walker=document.createTreeWalker(root, 4 /* TEXT_NODE */);
  const nodes=[];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    const raw=n.nodeValue, key=raw.trim();
    if(!key) return;
    if(DICT[key]!==undefined){ n.nodeValue=raw.replace(key,DICT[key]); return; }
    let out=key, hit=false;
    for(const [re,rep] of RULES){ const before=out; out=out.replace(re,rep); if(out!==before) hit=true; }
    if(hit) n.nodeValue=raw.replace(key,out);
  });
  root.querySelectorAll('[placeholder]').forEach(i=>{
    const v=DICT[i.placeholder]; if(v) i.placeholder=v;
  });
}

/* ---------------- app shell ---------------- */
function render(){
  if(!S.onboarded){ renderOnboarding(); return; }
  if(S.active){ renderRunner(); return; }
  const views={home:viewHome, workout:viewWorkout, progress:viewProgress, plan:viewPlan, settings:viewSettings};
  const d=today(), w=weekNumber(d), ph=phaseFor(w);
  $('#app').innerHTML = `
  <header>
    <div class="eyebrow"><span>${esc(fmtDate(d))}</span><span>Week ${Math.min(w,12)} / 12</span></div>
    <h1>${esc(headline(TAB))}<small>${esc(ph.name)}</small></h1>
  </header>
  <div class="taper"><i></i></div>
  <main class="fade">${views[TAB]()}</main>
  <nav>
    ${navBtn('home','⌂','Home')}${navBtn('workout','◼','Workout')}${navBtn('progress','◢','Progress')}
    ${navBtn('plan','▦','Plan')}${navBtn('settings','◌','Settings')}
  </nav>`;
  bindAll();
  if(SHEET) mountSheet();
}
function headline(t){
  return {home:'Today', workout:'Session', progress:'Progress', plan:'12-week plan', settings:'Settings'}[t];
}
function navBtn(id,i,t){
  return `<button data-tab="${id}" class="${TAB===id?'on':''}"><span class="i">${i}</span><span class="t">${t}</span></button>`;
}
function go(t){ TAB=t; SHEET=null; render(); window.scrollTo(0,0); }

/* ---------------- HOME ---------------- */
function viewHome(){
  const d=today(), w=weekNumber(d), plan=dayPlan(w,d.getDay()), lg=todayLog();
  const done=sessionOn(ymd(d));
  const ws=weekStats(w), st=streak(), tg=S.targets;
  const cw=currentWeight(), sw=S.profile.startWeight;
  const hour=d.getHours();
  const greet = hour<12?'Good morning':(hour<18?'Good afternoon':'Good evening');

  return `
  <div class="sec">
    <div class="small muted" style="margin-bottom:10px">${greet}, Calvin.</div>
    ${heroCard(plan, done)}
  </div>

  <div class="sec">
    <div class="sec-h">Today's targets</div>
    <div class="card stack">
      ${targetRow('Protein', lg.protein, tg.proteinLo, tg.proteinHi, 'g', 'protein')}
      ${targetRow('Steps', lg.steps, tg.stepsLo, tg.stepsHi, '', 'steps')}
      ${targetRow('Sleep', lg.sleep, tg.sleepLo, tg.sleepHi, 'h', 'sleep')}
      <div class="tiny muted">Protein food that actually works here: eggs, chicken, fish, beef, tofu, milk, soy milk, Greek yogurt. Keep the rice.</div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-h">Where you stand</div>
    <div class="grid2">
      <div class="card"><div class="label">Week</div><div class="big num">${Math.min(w,12)}<span style="font-size:15px;color:var(--ink-3)">/12</span></div></div>
      <div class="card"><div class="label">Sessions this week</div><div class="big num">${ws.done}<span style="font-size:15px;color:var(--ink-3)">/${ws.planned}</span></div></div>
      <div class="card"><div class="label">Weight now</div><div class="big num">${cw.toFixed(1)}<span style="font-size:14px;color:var(--ink-3)">kg</span></div><div class="tiny muted">start ${sw.toFixed(1)} kg</div></div>
      <div class="card"><div class="label">Streak</div><div class="big num">${st}</div><div class="tiny muted">rest days count</div></div>
    </div>
  </div>

  ${(d.getDay()===0 && !S.checkins.find(c=>c.week===w)) ? `
  <div class="sec"><div class="card">
    <div class="mid">Week ${w} check-in</div>
    <div class="small muted" style="margin:4px 0 12px">Nine quick questions, then I write your summary for next week.</div>
    <button class="btn dark" data-sheet="checkin">Start check-in</button>
  </div></div>`:''}

  <div class="sec">
    <div class="note">Beginner rules that keep you training: stop on sharp or unusual pain, never trade form for reps, never train through joint pain, no maximal lifting. Chest pain, severe dizziness or breathlessness means stop and get medical help. This app is a training log, not a doctor.</div>
  </div>`;
}

  if(plan.type==='REST'){
    return `<div class="hero rest-hero"><div class="body">
      <div class="label" style="color:#b7ded4">Today</div>
      <div class="kind">Full rest</div>
      <div class="meta">Rest is part of the program, not a gap in it. Muscle is built on the days you leave it alone.</div>
      <div style="margin-top:14px" class="small">Optional: a short walk, some stretching, a real 7–9 hours of sleep.</div>
    </div></div>`;
  }
  if(plan.type==='RECOVERY'){
    const lg=todayLog();
    return `<div class="hero rest-hero"><div class="body">
      <div class="label" style="color:#b7ded4">Today</div>
      <div class="kind">Recovery walk</div>

/* ---------------- PLAN ---------------- */
function viewPlan(){
  const now=today(), cw=weekNumber(now), start=mondayOf(parseYmd(S.profile.startDate));
  let weeks='';
  for(let w=1;w<=12;w++){
    let cells='';
    for(let i=0;i<7;i++){
      const d=new Date(start); d.setDate(d.getDate()+(w-1)*7+i);
      const dow=d.getDay(), t=dayPlan(w,dow).type;
      const key = t==='A'?'A':t==='B'?'B':t==='C'?'C':t==='RECOVERY'?'R':'X';
      const label = t==='A'?'A':t==='B'?'B':t==='C'?'Core':t==='RECOVERY'?'Walk':'Rest';
      const isToday = ymd(d)===ymd(now);
      const done = !!sessionOn(ymd(d));
      cells+=`<div class="dwrap"><div class="d ${key} ${isToday?'today':''}">${label}</div>${done?'<span class="tick">✓</span>':''}</div>`;
    }
    const st=weekStats(w), ph=phaseFor(w);
    weeks+=`<div class="wk" style="margin-bottom:6px">
      <div class="wn">W${w}</div>${cells}</div>`;
    if(w===2||w===4||w===8||w===12){
      weeks+=`<div class="tiny muted" style="margin:8px 0 14px">${esc(ph.name)} ends here.</div>`;
    }
  }
  const phases = PHASES.map(p=>{
    const on = cw>=p.w[0]&&cw<=p.w[1];
    return `<div class="card" style="${on?'border-color:var(--ink);border-width:2px':''}">
      <div class="row"><div class="mid">${esc(p.name)}</div><span class="pill">W${p.w[0]}–${p.w[1]}</span></div>
      <div class="small muted" style="margin-top:6px">${esc(p.goal)}</div></div>`;
  }).join('');

  return `
  <div class="sec">
    <div class="sec-h">Calendar</div>
    <div class="wk" style="margin-bottom:8px"><div></div>${(isZH()?DSH_ZH:DSH).map(x=>`<div class="wn" style="text-align:center">${x}</div>`).join('')}</div>
    ${weeks}
    <div class="legend" style="margin-top:10px">
      <span class="chip c-a">A</span><span class="chip c-b">B</span><span class="chip c-core">Core + cardio</span>
      <span class="chip c-rest">Walk / rest</span>
    </div>
    <div class="tiny muted" style="margin-top:10px">Odd weeks open with A, even weeks open with B, so both sessions get hit three times every fortnight.</div>
  </div>
  <div class="sec">
    <div class="sec-h">Phases</div>
    <div class="stack">${phases}</div>
  </div>`;
}

/* ---------------- PROGRESS ---------------- */
function sparkline(vals, color){
  if(vals.length<2) return `<div class="tiny muted">Two entries and this becomes a chart.</div>`;
  const w=300,h=100, min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||1;
  const pts=vals.map((v,i)=>[ (i/(vals.length-1))*w, h - ((v-min)/span)*(h-14) - 7 ]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${color}"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${dots}</svg>
  <div class="row tiny muted num"><span>${min.toFixed(1)}</span><span>${max.toFixed(1)}</span></div>`;
}
function barsChart(items){
  return `<div class="stack" style="gap:8px">${items.map(it=>`
    <div><div class="row tiny"><span>${esc(it.label)}</span><span class="num muted">${it.text}</span></div>
    <div style="margin-top:4px">${bar(it.pct, it.cls||'')}</div></div>`).join('')}</div>`;
}
function viewProgress(){
  const m=S.measures, w=weekNumber(today());
  const weights=m.filter(x=>x.weight).map(x=>x.weight);
  const waists=m.filter(x=>x.waist).map(x=>x.waist);
  const last=latestMeasure();

  // strength: best set per tracked lift
  const tracked=['pushup','row','press','squat','bss','lateral','floorpress','rdl'];
  const strength=tracked.map(id=>{
    const first=firstReps(id), best=S.bests[id];
    if(!best) return `<div class="row" style="padding:9px 0;border-top:1px solid var(--line)">
      <div class="small">${esc(EX[id].name)}</div><div class="tiny muted">not logged yet</div></div>`;
    const delta = first? best-first : 0;
    return `<div class="row" style="padding:9px 0;border-top:1px solid var(--line)">
      <div class="small" style="flex:1">${esc(EX[id].name)}</div>
      <div class="num small">${first?first+' → ':''}<b>${best}</b>${EX[id].time?'s':''}
        ${delta>0?`<span style="color:var(--pine)"> +${delta}</span>`:''}</div></div>`;
  }).join('');

  // consistency
  const totalSessions=S.sessions.length;
  const totalDays=new Set(S.sessions.map(s=>s.date)).size;
  const weeksBars=[];
  for(let i=Math.max(1,w-5);i<=w;i++){
    const st=weekStats(i);
    weeksBars.push({label:'Week '+i, text:st.done+'/'+st.planned, pct:st.planned?st.done/st.planned*100:0, cls:'pine'});
  }

  return `
  <div class="sec">
    <div class="sec-h">Body</div>
    <div class="card">
      <div class="grid3">
        <div><div class="label">Weight</div><div class="mid num">${(last&&last.weight?last.weight:S.profile.weight).toFixed(1)}<span class="tiny muted">kg</span></div></div>
        <div><div class="label">Waist</div><div class="mid num">${last&&last.waist?last.waist.toFixed(1):'—'}<span class="tiny muted">cm</span></div></div>
        <div><div class="label">Entries</div><div class="mid num">${m.length}</div></div>
      </div>
      <div style="margin-top:14px"><button class="btn ghost" data-sheet="measure">Log measurements</button></div>
    </div>
    <div class="card">
      <div class="label">Weight trend</div>
      ${sparkline(weights,'#1f37d8')}
      <div class="label" style="margin-top:16px">Waist trend</div>
      ${sparkline(waists,'#0d6f5c')}
      <div class="note pine" style="margin-top:14px">Scale weight alone tells you almost nothing here. Weight flat, waist down, strength up is exactly the result you are training for.</div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-h">Strength — first vs best set</div>
    <div class="card">${strength}</div>
  </div>

  <div class="sec">
    <div class="sec-h">Consistency</div>
    <div class="card">
      <div class="grid3">
        <div><div class="label">Streak</div><div class="mid num">${streak()}</div></div>
        <div><div class="label">Sessions</div><div class="mid num">${totalSessions}</div></div>
        <div><div class="label">Training days</div><div class="mid num">${totalDays}</div></div>
      </div>
      <div style="margin-top:16px">${barsChart(weeksBars)}</div>
    </div>
  </div>

  ${S.checkins.length?`<div class="sec"><div class="sec-h">Weekly summaries</div>
    <div class="stack">${[...S.checkins].reverse().map(c=>`<div class="card">
      <div class="row"><div class="mid">Week ${c.week}</div><span class="pill">${c.workouts} sessions</span></div>
      <div class="small" style="margin-top:8px">${esc(c.summary)}</div></div>`).join('')}</div></div>`:''}

  ${S.sessions.length?`<div class="sec"><div class="sec-h">Session log</div>
    <div class="card">${[...S.sessions].reverse().slice(0,12).map(s=>`
      <div class="row" style="padding:9px 0;border-top:1px solid var(--line)">
        <div class="small">${esc(s.date)} · ${esc(WORKOUTS[s.type]?WORKOUTS[s.type].title:s.type)}</div>
        <div class="tiny num muted">${Math.round(s.durationSec/60)}m · ${s.totalSets} sets${s.prs.length?' · '+s.prs.length+' PR':''}</div>
      </div>`).join('')}</div></div>`:''}`;
}
function firstReps(id){
  for(const s of S.sessions){ const set=s.sets.find(x=>x.ex===id); if(set) return set.reps; }
  return null;
}

/* ---------------- RUNNER ---------------- */
function startWorkout(code){
  S.active={ type:code, date:ymd(today()), startedAt:Date.now(), warmup:false, idx:0, sets:[], entry:null };
  saveState(); render(); window.scrollTo(0,0);
}
function setsDone(exId){ return S.active.sets.filter(x=>x.ex===exId).length; }

function renderRunner(){
  const A=S.active, W=WORKOUTS[A.type], list=W.exs;
  const totalSets=list.reduce((n,id)=>n+setsFor(A.type,id),0);
  const doneSets=A.sets.length;
  const mins=Math.floor((Date.now()-A.startedAt)/60000);

  if(A.finished){ $('#app').innerHTML=completionHTML(); bindAll(); return; }

  let body='';
  if(!A.warmup){
    body=`<div class="sec"><div class="card">
      <div class="mid">Warm-up</div>
      <div class="small muted" style="margin:4px 0 12px">About six minutes. This is most of your injury insurance, do not skip it.</div>
      <div class="stack small">${WARMUP.map(x=>'<div>· '+esc(x)+'</div>').join('')}</div>
      <div style="margin-top:16px"><button class="btn" data-act="warmup">Warm-up done</button></div>
    </div></div>`;
  } else {
    body = list.map((id,i)=>{
      const e=EX[id], n=setsFor(A.type,id), d=setsDone(id);
      if(i!==A.idx){
        return `<div class="card row" style="opacity:${d>=n?0.55:0.85}">
          <div><div class="small" style="font-weight:600">${esc(e.name)}</div>
          <div class="tiny muted num">${d}/${n} sets${d>=n?' ✓':''}</div></div>
          <button class="btn sm ghost" data-jump="${i}">${d>=n?'Redo':'Go'}</button></div>`;
      }
      return currentExerciseCard(id, n, d);
    }).join('');
    body = `<div class="sec stack">${body}</div>
    <div class="sec"><button class="btn dark" data-act="finish">Finish workout</button></div>`;
  }

  $('#app').innerHTML=`
  <header>
    <div class="eyebrow"><span>${esc(W.title)}</span><span>${doneSets}/${totalSets} sets · ${mins} min</span></div>
    <h1>In session<small>${esc(phaseFor(weekNumber(today())).name)}</small></h1>
    <div style="margin-top:12px">${bar(doneSets/totalSets*100)}</div>
  </header>
  <div class="taper"><i></i></div>
  <main class="fade">${body}
    <div class="sec"><button class="link" data-act="abandon">Cancel this session</button></div>
  </main>`;
  bindAll();
  if(TIMER) mountTimer();
  if(SHEET) mountSheet();
}

function currentExerciseCard(id, n, d){
  const e=EX[id], A=S.active;
  const dots=Array.from({length:n},(_,k)=>`<span class="${k<d?'done':(k===d?'now':'')}"></span>`).join('');
  const prog = shouldProgress(id);
  const last = lastSetsText(id);
  const entry = A.entry && A.entry.ex===id ? A.entry : null;
  const suggested = entry? entry.reps : suggestReps(id);

  return `<div class="card" style="border-color:var(--ink);border-width:2px">
    <div class="ex-head">
      <div>
        <div class="mid">${esc(e.name)}</div>
        <div class="tiny num muted" style="margin-top:3px">${n} × ${e.lo}–${e.hi}${e.time?' sec':' reps'}${e.side?' each side':''} · rest ${restFor(id)} s</div>
        <div class="tiny muted">${esc(e.kit)}</div>
      </div>
      ${e.prio?'<span class="pill c-a">priority</span>':''}
    </div>
    <div class="setdots">${dots}</div>
    ${last?`<div class="tiny muted num" style="margin-top:10px">Last time: ${esc(last)}</div>`:''}
    ${prog?`<div class="note" style="margin-top:10px">You topped the range last session with reps left over. ${esc(S.profile.equipment==2?'Add load this session.':e.prog)}</div>`:''}
    ${e.heavy?`<div class="note" style="margin-top:10px">${esc(e.prog)}</div>`:''}
    ${e.alt?`<div class="note blue" style="margin-top:10px">${esc(e.alt)}</div>`:''}

    ${d>=n? `<div style="margin-top:14px"><button class="btn pine" data-act="nextex">All sets done — next exercise</button></div>` :
    (entry? `
      <div style="margin-top:16px" class="stack">
        <div class="label">Set ${d+1} — ${e.time?'seconds held':'reps completed'}${e.side?' per side':''}</div>
        <div class="stepper">
          <button data-step="-1">−</button>
          <input type="number" id="repsIn" value="${suggested}" inputmode="numeric">
          <button data-step="1">+</button>
        </div>
        <div class="label">How did it feel</div>
        <div class="seg">
          ${['Easy','Normal','Hard'].map(x=>`<button data-diff="${x}" class="${entry.diff===x?'on':''}">${x}</button>`).join('')}
        </div>
        <button class="btn pine" data-act="completeset">Complete set ✓</button>
        <button class="link" data-act="cancelset">Cancel</button>
      </div>`
    : `<div style="margin-top:16px" class="stack">
        <button class="btn" data-act="startset">Start set ${d+1}</button>
        <div class="row"><button class="link" data-sheet="ex:${id}">View instructions</button>
        <button class="link" data-act="skipex">Skip exercise</button></div>
      </div>`)}
  </div>`;
}
function suggestReps(id){
  const e=EX[id];
  for(let i=S.sessions.length-1;i>=0;i--){
    const sets=S.sessions[i].sets.filter(x=>x.ex===id);
    if(sets.length) return Math.min(e.hi, sets[sets.length-1].reps);
  }
  return e.lo;
}
function lastSetsText(id){
  for(let i=S.sessions.length-1;i>=0;i--){
    const sets=S.sessions[i].sets.filter(x=>x.ex===id);
    if(sets.length) return sets.map(x=>x.reps).join(' / ')+'  ('+S.sessions[i].date+')';
  }
  return null;
}

/* ---------------- rest timer ---------------- */
function startTimer(sec,label){
  if(TIMER&&TIMER.id) clearInterval(TIMER.id);
  TIMER={left:sec,total:sec,label:label};
  TIMER.id=setInterval(()=>{
    TIMER.left--;
    if(TIMER.left<=0){ TIMER.left=0; clearInterval(TIMER.id); TIMER.id=null; TIMER.done=true; buzz(); }
    mountTimer();
  },1000);
  mountTimer();
}
function stopTimer(){ if(TIMER&&TIMER.id) clearInterval(TIMER.id); TIMER=null; const n=$('#timerSheet'); if(n) n.remove(); }
function buzz(){ try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){} }
function mountTimer(){

    ${done?'<div class="mid" style="text-align:center;margin-bottom:14px">Next set</div>':
      `<div style="margin:14px 0">${bar((1-TIMER.left/TIMER.total)*100)}</div>`}
    <div class="seg" style="margin-bottom:10px">
      <button data-timer="-15">−15 s</button><button data-timer="15">+15 s</button>
    </div>
    <button class="btn ${done?'pine':'dark'}" data-timer="skip">${done?'Continue':'Skip rest'}</button>
  </div></div>`);
  document.body.appendChild(node);
  applyLang(node);
  node.querySelectorAll('[data-timer]').forEach(b=>b.onclick=()=>{
    const v=b.dataset.timer;
    if(v==='skip'){ stopTimer(); return; }
    const nl=Math.max(1,TIMER.left+Number(v));
    const lab=TIMER.label; const tot=Math.max(TIMER.total,nl);
    startTimer(nl,lab); TIMER.total=tot;
  });
}

function finishWorkout(){
  const A=S.active;
  A.prs=[];
  A.sets.forEach(s=>{
    const b=S.bests[s.ex]||0;
    if(s.reps>b){
      S.bests[s.ex]=s.reps;
      const p=A.prs.find(x=>x.ex===s.ex);
      if(p) p.reps=s.reps; else A.prs.push({ex:s.ex,reps:s.reps});
    }
  });
  A.finished=true;
  stopTimer();
  saveState(); renderRunner();
}
function closeSession(){
  const A=S.active;
  const rec={ date:A.date, type:A.type, durationSec:Math.round((Date.now()-A.startedAt)/1000),
    sets:A.sets, totalSets:A.sets.length, prs:A.prs||[] };
  const i=S.sessions.findIndex(s=>s.date===rec.date && s.type===rec.type);
  if(i>=0) S.sessions[i]=rec; else S.sessions.push(rec);
  S.sessions.sort((a,b)=>a.date<b.date?-1:1);
  S.active=null; saveState(); TAB='home'; render(); window.scrollTo(0,0);
}

function saveSheet(kind,node){
  const num=id=>{ const v=node.querySelector('#'+id); if(!v||v.value==='') return null; return Number(v.value); };

function buildSummary(c){
  if(isZH()) return buildSummaryZH(c);
  const st=weekStats(c.week);
  let out=[];
  if(c.workouts>=st.planned) out.push(`Full week, ${c.workouts}/${st.planned} sessions done.`);
  else if(c.workouts>0) out.push(`${c.workouts}/${st.planned} sessions. Not perfect, and it still counts. Pick up the normal schedule, do not double anything.`);
  else out.push('No sessions this week. Restart at the next scheduled day, same weights, no punishment.');
  const prev=S.checkins.find(x=>x.week===c.week-1);
  if(prev&&prev.waist&&c.waist){
    const d=+(c.waist-prev.waist).toFixed(1);
    out.push(d<0?`Waist down ${Math.abs(d)} cm.`:(d>0?`Waist up ${d} cm, watch portions rather than cutting food hard.`:'Waist holding steady.'));
  }
  if(c.best) out.push(`Biggest jump: ${c.best}.`);
  if(c.pain==='Real pain') out.push('You reported real pain. Drop the exercise that caused it, swap to a pain-free variation, and get it checked if it persists.');
  else if(c.hard==='Too hard') out.push('Training felt too hard, so keep the same numbers next week instead of adding anything.');
  else if(c.hard==='Easy') out.push('Training felt easy, so add reps or slow the lowering phase next week.');
  else out.push('Keep the same training difficulty next week and let the reps creep up.');
  if(c.sleep==='Poor') out.push('Sleep is the weak link right now, that matters more than any set you did.');
  if(c.protein==='No') out.push('Protein slipped. One extra egg or a glass of milk per meal closes most of that gap.');
  return out.join(' ');
}


function buildSummaryZH(c){
  const st=weekStats(c.week);
  let out=[];
  if(c.workouts>=st.planned) out.push('完整的一周，'+c.workouts+'/'+st.planned+' 次训练全部完成。');
  else if(c.workouts>0) out.push(c.workouts+'/'+st.planned+' 次。不完美，但依然算数。按正常计划继续，不用补练。');
  else out.push('这周一次都没练。下一个训练日照常开始，重量不变，也不用惩罚自己。');
  const prev=S.checkins.find(x=>x.week===c.week-1);
  if(prev&&prev.waist&&c.waist){
    const d=+(c.waist-prev.waist).toFixed(1);
    out.push(d<0?('腰围下降 '+Math.abs(d)+' 厘米。'):(d>0?('腰围上升 '+d+' 厘米，先控制份量，不要急着大幅节食。'):'腰围保持稳定。'));
  }
  if(c.best) out.push('进步最大的是：'+c.best+'。');
  if(c.pain==='Real pain') out.push('你记录了明显疼痛。停掉引起疼痛的动作，换成不痛的变式；如果持续，去看医生。');
  else if(c.hard==='Too hard') out.push('训练感觉太难，下周保持同样的数字，先不要加任何东西。');
  else if(c.hard==='Easy') out.push('训练感觉轻松，下周可以加次数或放慢下放速度。');
  else out.push('下周保持同样难度，让次数自然往上爬。');
  if(c.sleep==='Poor') out.push('目前睡眠是最短的那块板，它比你做的任何一组都重要。');
  if(c.protein==='No') out.push('蛋白质没跟上。每餐多一个鸡蛋或一杯牛奶，基本就补回来了。');
  return out.join('');
}

function act(a){
  const A=S.active;
  if(a==='warmup'){ A.warmup=true; saveState(); renderRunner(); return; }
  if(a==='startset'){ const id=WORKOUTS[A.type].exs[A.idx]; A.entry={ex:id, reps:suggestReps(id), diff:'Normal'}; saveState(); renderRunner(); return; }
  if(a==='cancelset'){ A.entry=null; renderRunner(); return; }
  if(a==='completeset'){
    const i=$('#repsIn'); const reps=Math.max(0,Number(i?i.value:A.entry.reps));
    const id=A.entry.ex, e=EX[id];
    A.sets.push({ex:id, reps, diff:A.entry.diff||'Normal'});
    A.entry=null;
    const n=setsFor(A.type,id), d=setsDone(id);
    if(d>=n){ if(A.idx < WORKOUTS[A.type].exs.length-1) A.idx++; }
    saveState(); renderRunner();
    if(d<n || A.idx<WORKOUTS[A.type].exs.length) startTimer(restFor(id), e.name);
    return;
  }
  if(a==='nextex'){ if(A.idx<WORKOUTS[A.type].exs.length-1) A.idx++; saveState(); renderRunner(); window.scrollTo(0,0); return; }
  if(a==='skipex'){ if(A.idx<WORKOUTS[A.type].exs.length-1){A.idx++; saveState(); renderRunner(); window.scrollTo(0,0);} return; }
  if(a==='finish'){ if(!A.sets.length){ if(!confirm(isZH()?'还没有记录任何一组，确定结束吗？':'No sets logged. Finish anyway?')) return; } finishWorkout(); return; }
  if(a==='closesession'){ closeSession(); return; }
  if(a==='abandon'){ if(confirm(isZH()?'取消本次训练？已记录的组数会被丢弃。':'Cancel this session? Logged sets will be discarded.')){ stopTimer(); S.active=null; saveState(); TAB='home'; render(); } return; }
  if(a==='export'){
    const t=JSON.stringify(S);
    navigator.clipboard? navigator.clipboard.writeText(t).then(()=>alert(isZH()?'备份已复制，粘贴到安全的地方保存。':'Backup copied. Paste it somewhere safe.'),()=>alert(t)) : alert(t);
    return;
  }
  if(a==='reset'){
    if(confirm(isZH()?'清空所有训练、围度和记录？此操作无法撤销。':'Erase all workouts, measurements and logs? This cannot be undone.')){
      const keep=S.lang; S=freshState(); S.lang=keep; OB=1; TAB='home'; saveState(); render();
    }
    return;
  }
}

/* ---------------- boot ---------------- */
(async function(){
  const loaded=await loadState();
  S = loaded ? Object.assign(freshState(), loaded) : freshState();
  if(!S.profile) S.profile=freshState().profile;
  if(!S.targets) S.targets=freshState().targets;
  if(S.active && S.active.date!==ymd(today())) S.active=null;
  if(S.lang==='zh'){ document.documentElement.lang='zh-CN'; document.body.style.fontFamily='-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif'; }   // stale session from another day
  render();
  setInterval(()=>{ if(S.active && !S.active.finished && !TIMER && !SHEET) { /* keep the minute counter fresh */ } }, 60000);
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
